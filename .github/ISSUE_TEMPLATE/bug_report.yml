name: Bug report
description: The module does something it should not, or does not do something it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not report a security vulnerability here. Follow
        [SECURITY.md](https://github.com/latere-ai/apps/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        manifest.Parse accepted a latere-app.yaml with ... but the platform refused it with ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: >
        The shortest program, test or latere-app.yaml that shows the
        problem, with its output. Remove anything from a manifest that you
        do not want to publish.
    validations:
      required: true

  - type: dropdown
    id: package
    attributes:
      label: Package
      multiple: true
      options:
        - codes
        - manifest
        - authorizer
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The module version, from `go list -m latere.ai/x/apps` in your module.
      placeholder: v0.0.4
    validations:
      required: true

  - type: input
    id: go
    attributes:
      label: Go version and platform
      description: The output of `go version`.
      placeholder: go version go1.27.3 darwin/arm64
