kind: service
service:
  builder: jammy-base
  start: node server.js
  port: 8080
  health: /healthz
  resources:
    memory: 256Mi
    cpu: 250m
  replicas:
    min: 1
    max: 1
  public_paths: [/webhooks/*]
  forward_authorization: false
  migrate: npm run migrate
links:
  - api
env:
  NODE_ENV: production
  API_URL: ${{ links.api.url }}
  DEBUG: false
  RETRIES: 3
resources:
  db:
    type: postgres
    size: 1Gi
    preview: copy
  cache:
    type: cache
